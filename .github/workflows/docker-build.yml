name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        # 1. 補上 QEMU，讓 x86 機器可以跨架構編譯 ARM64 鏡像
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image names
        run: |
          echo "SERVER_IMAGE=${REGISTRY}/${IMAGE_PREFIX,}/vps-monitor-server:latest" >> $GITHUB_ENV
          echo "AGENT_IMAGE=${REGISTRY}/${IMAGE_PREFIX,}/vps-monitor-agent:latest" >> $GITHUB_ENV

# 2. Server 加上多架構 platforms
      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.SERVER_IMAGE }}

# 3. Agent 加上多架構 platforms
      - name: Build and push Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.AGENT_IMAGE }}
