services:
  monitor:
    image: ghcr.io/${GHCR_OWNER:-qzqmn}/vps-monitor-server:latest
    # 想改原始碼後自己建置測試（而不是拉 ghcr 上 CI 建好的映像），
    # 就把上面的 image: 註解掉、改用下面這段：
    # build:
    #   context: ./server
    #   dockerfile: Dockerfile
    container_name: vps-monitor
    restart: unless-stopped
    init: true
    ports:
      # 預設只綁 BIND_ADDR（.env 裡設定，預設 127.0.0.1），不會整台機器公網暴露。
      # 要用 Tailscale 存取就把 .env 的 BIND_ADDR 改成你的 Tailscale IP。
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:/app/data/monitor.db?mode=rwc
      # 帳密（管理員登入）跟每台機器的上報密鑰現在都存在資料庫裡、透過網頁
      # 設定，不再需要 REPORT_SECRET / ADMIN_SECRET 這兩個環境變數了。
      # 只有真的架了 HTTPS 反向代理，才需要打開這個讓登入 Cookie 加上 Secure：
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
